<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Chủ - Werewolf Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    h1 { color: #e74c3c; }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 20px;
    }
    .btn:hover { background-color: #2980b9; }

    .status {
      margin-top: 20px;
      font-weight: bold;
    }

    .log {
      margin: 20px auto;
      width: 80%;
      max-width: 500px;
      height: 150px;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
      text-align: left;
      font-size: 14px;
    }

    .online { color: green; }
    .offline { color: red; }
  </style>
</head>
<body>

<h1>🐺 Chào mừng đến với Ma Sói!</h1>
<p>Nếu bạn thấy dòng chữ này, nghĩa là <b>CI/CD Frontend đã chạy thành công!</b></p>

<!-- API status -->
<div id="apiStatus" class="status">🔄 Đang kiểm tra API...</div>

<!-- WebSocket status -->
<div id="wsStatus" class="status">🔄 Đang kết nối WebSocket...</div>

<!-- Chat log -->
<div class="log" id="log"></div>

<button class="btn" onclick="sendMessage()">Gửi test WebSocket</button>
<br />

<script>
  const logEl = document.getElementById('log');
  const apiStatusEl = document.getElementById('apiStatus');
  const wsStatusEl = document.getElementById('wsStatus');

  function log(message) {
    const p = document.createElement('div');
    p.textContent = message;
    logEl.appendChild(p);
    logEl.scrollTop = logEl.scrollHeight;
  }

  /* ================= API TEST ================= */
  fetch('https://werewolf.anhdh.net/api/ping')
          .then(res => res.json())
          .then(data => {
            apiStatusEl.innerHTML = '✅ API Connected';
            apiStatusEl.classList.add('online');
            log('API response: ' + JSON.stringify(data));
          })
          .catch(err => {
            apiStatusEl.innerHTML = '❌ API Disconnected';
            apiStatusEl.classList.add('offline');
            log('API error: ' + err.message);
          });

  /* ================= WEBSOCKET TEST ================= */
  const wsUrl = `wss://werewolf.anhdh.net`;
  const ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    wsStatusEl.innerHTML = '✅ WebSocket Connected';
    wsStatusEl.classList.add('online');
    log('WebSocket connected');
  };

  ws.onmessage = (event) => {
    log('WS message: ' + event.data);
  };

  ws.onerror = () => {
    wsStatusEl.innerHTML = '❌ WebSocket Error';
    wsStatusEl.classList.add('offline');
  };

  ws.onclose = () => {
    wsStatusEl.innerHTML = '❌ WebSocket Closed';
    wsStatusEl.classList.add('offline');
    log('WebSocket disconnected');
  };

  function sendMessage() {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send('Hello BE 👋 from FE');
      log('You: Hello BE 👋 from FE');
    } else {
      log('WebSocket chưa kết nối');
    }
  }
</script>

</body>
</html>
