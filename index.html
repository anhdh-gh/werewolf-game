<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Game</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .msg { padding: 5px; border-bottom: 1px solid #eee; }
        input { width: 70%; padding: 10px; }
        button { width: 25%; padding: 10px; background: #333; color: #fff; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🐺 Ma Sói Room</h2>
    <div id="status" style="color: green; margin-bottom: 10px;">Đang kết nối...</div>
    
    <div id="messages"></div>
    
    <form id="chatForm">
        <input id="input" autocomplete="off" placeholder="Nhập tin nhắn..." /><button>Gửi</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Kết nối thẳng vào domain hiện tại
        const socket = io(); 

        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        const form = document.getElementById('chatForm');
        const input = document.getElementById('input');

        socket.on('connect', () => {
            statusDiv.textContent = "✅ Đã kết nối tới Server!";
            statusDiv.style.color = "green";
        });

        socket.on('disconnect', () => {
            statusDiv.textContent = "❌ Mất kết nối!";
            statusDiv.style.color = "red";
        });

        // Nhận tin nhắn từ server
        socket.on('server_message', (msg) => {
            const item = document.createElement('div');
            item.className = 'msg';
            item.textContent = msg;
            messagesDiv.appendChild(item);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // Gửi tin nhắn
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat_message', input.value);
                input.value = '';
            }
        });
    </script>
</body>
</html>
