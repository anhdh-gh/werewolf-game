name: Auto Deploy

on:
  push:
    branches: [ backend ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS 1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_1_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/werewolf-game
            git pull
            npm install --production
            pm2 restart all

      - name: Deploy to VPS 2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_2_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/werewolf-game
            git pull
            npm install --production
            pm2 restart all
