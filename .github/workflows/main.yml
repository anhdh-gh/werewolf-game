name: Auto Deploy to Hosting

on:
  push:
    branches:
      - backend  # Chỉ chạy khi push code vào nhánh backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTING_HOST }}
          username: ${{ secrets.HOSTING_USERNAME }}
          password: ${{ secrets.HOSTING_PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            # 1. Đi vào đúng thư mục chứa code (Dựa theo log bạn gửi)
            cd /home/anhdhnet/repositories/be/werewolf-game
            
            # 2. Pull code mới nhất về
            echo "Drafting new code..."
            git pull origin backend
            
            # 3. Kích hoạt môi trường ảo Node.js (Dựa theo log bạn gửi)
            echo "Installing dependencies..."
            source /home/anhdhnet/nodevenv/repositories/be/werewolf-game/20/bin/activate
            
            # 4. Cài đặt thư viện
            npm install
            
            # 5. Khởi động lại Server (Kết hợp cả 2 cách bạn dùng để chắc ăn nhất)
            echo "Restarting server..."
            
            # Cách 1: Tạo file restart.txt (Cách chuẩn của Passenger)
            mkdir -p tmp
            touch tmp/restart.txt
            
            # Cách 2: Kill process cũ (Cách mạnh tay bạn đã dùng)
            # Thêm "|| true" để nếu không có process nào chạy thì không báo lỗi đỏ
            pkill -u ${{ secrets.USERNAME }} node || true
            
            echo "DEPLOY THÀNH CÔNG!"
