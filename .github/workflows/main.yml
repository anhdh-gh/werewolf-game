name: Auto Deploy to Hosting

on:
  push:
    branches:
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTING_HOST }}
          username: ${{ secrets.HOSTING_USERNAME }}
          password: ${{ secrets.HOSTING_PASSWORD }}
          port: ${{ secrets.HOSTING_PORT }}
          timeout: "60s"
          script: |
            cd /home/${{ secrets.HOSTING_USERNAME }}/repositories/be/werewolf-game
            git pull origin backend
            echo "Activating environment and installing dependencies..."
            source /home/${{ secrets.HOSTING_USERNAME }}/nodevenv/repositories/be/werewolf-game/20/bin/activate
            npm install --production
            # "|| true" ensures the workflow doesn't fail if no process is currently running
            pkill -u ${{ secrets.HOSTING_USERNAME }} node || true
            mkdir -p tmp
            touch tmp/restart.txt
            echo "DEPLOYMENT SUCCESSFUL!"