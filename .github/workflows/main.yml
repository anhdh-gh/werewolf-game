name: Auto Deploy to Hosting

on:
  push:
    branches:
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          # Use secrets from GitHub Settings
          host: ${{ secrets.HOSTING_HOST }}
          username: ${{ secrets.HOSTING_USERNAME }}
          password: ${{ secrets.HOSTING_PASSWORD }}
          port: ${{ secrets.HOSTING_PORT }} # Make sure this secret is set to 22
          request_pty: true
          timeout: "60s"

          script: |
            # --- START DEPLOYMENT SCRIPT ---
            
            # 1. Navigate to the project directory
            # Using the username variable to ensure the path is correct
            cd /home/${{ secrets.HOSTING_USERNAME }}/repositories/be/werewolf-game
            
            # 2. Pull the latest code from the 'backend' branch
            echo "Pulling latest code..."
            git pull origin backend
            
            # 3. Activate Node.js virtual environment
            echo "Activating environment and installing dependencies..."
            source /home/${{ secrets.HOSTING_USERNAME }}/nodevenv/repositories/be/werewolf-game/20/bin/activate
            
            # 4. Install production dependencies only
            echo "Installing dependencies..."
            npm install --production
            
            # 5. Restart the Node.js Server
            echo "Generating Prisma Client..."
            npx prisma generate
          
            echo "Restarting server..."
            
            # Method 1: Force kill old Node.js processes for this user
            # "|| true" ensures the workflow doesn't fail if no process is currently running
            pkill -u ${{ secrets.HOSTING_USERNAME }} node || true
            
            # Method 2: Trigger Passenger restart via restart.txt
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "DEPLOYMENT SUCCESSFUL!"